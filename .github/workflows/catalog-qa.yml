name: Catalog adaptive QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run e2e:catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-qa-evidence
          path: test-results/
          retention-days: 14
